<div class="shell">
  <header class="topbar">
    <span class="brand">Kashira Finance</span>

    <nav class="nav">
      <a routerLink="/app/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/app/expenses" routerLinkActive="active">Gastos</a>
      <a routerLink="/app/incomes" routerLinkActive="active">Ingresos</a>
      <a routerLink="/app/categorias" routerLinkActive="active">Categorías</a>
    </nav>

    <div class="user-zone">
      @if (currentUser(); as user) {
        <span class="user-name">{{ user.name }}</span>
      }
      <button type="button" class="btn-logout" (click)="logout()">
        Salir
      </button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
