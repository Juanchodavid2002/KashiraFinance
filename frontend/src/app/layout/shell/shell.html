<div class="app">
  <aside
    class="sidebar"
    [class.open]="sidebarOpen()"
    aria-label="Menú principal"
  >
    <div class="sidebar-brand">
      <div class="brand-logo">K</div>
      <div class="brand-text">
        <strong>Kashira</strong>
        <span>Finance</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">General</div>
      <nav class="sidebar-nav">
        <a
          routerLink="/app/dashboard"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a
          routerLink="/app/expenses"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">💸</span>
          <span>Gastos</span>
        </a>
        <a
          routerLink="/app/incomes"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">💰</span>
          <span>Ingresos</span>
        </a>
        <a
          routerLink="/app/debts"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">🧾</span>
          <span>Deudas</span>
        </a>
        <a
          routerLink="/app/services"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">🧮</span>
          <span>Servicios</span>
        </a>
        <a
          routerLink="/app/envelopes"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">✉️</span>
          <span>Sobres</span>
        </a>
        <a
          routerLink="/app/categorias"
          routerLinkActive="active"
          class="nav-link"
        >
          <span class="icon">🏷️</span>
          <span>Categorías</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-footer">
      @if (currentUser(); as user) {
        <div class="user-card">
          <div class="user-avatar">{{ userInitials() }}</div>
          <div class="user-meta">
            <strong>{{ user.name }}</strong>
            <span>{{ user.email }}</span>
          </div>
        </div>
      }
      <a
        routerLink="/app/configuracion"
        routerLinkActive="active"
        class="nav-link config-link"
      >
        <span class="icon">⚙️</span>
        <span>Configuración</span>
      </a>
      <button type="button" class="logout-btn" (click)="logout()">
        <span class="logout-icon">🚪</span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div
    class="sidebar-overlay"
    [class.active]="sidebarOpen()"
    (click)="closeSidebar()"
  ></div>

  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-btn mobile-menu-btn"
        aria-label="Abrir menú"
        (click)="openSidebar()"
      >
        ☰
      </button>
      <div class="page-title">
        <h1>Kashira Finance</h1>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
