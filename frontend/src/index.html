<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Kashira Finance</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Organiza tus gastos, controla tus ingresos y entiende mejor en qué estás utilizando tu dinero con KashiraFinance.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans@5.0.5/index.css">
  <script>
    (function () {
      try {
        var p = localStorage.getItem('kashira_theme') || 'system';
        var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark && location.pathname.indexOf('/app') === 0) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
